<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 PWM Control</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { display: inline-block; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); width: 85%; max-width: 400px; }
        h2 { color: #333333; margin-bottom: 20px; }
        .slider { -webkit-appearance: none; width: 100%; height: 12px; border-radius: 6px; background: #ddd; outline: none; margin: 25px 0; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #007bff; cursor: pointer; }
        .val-text { font-size: 22px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Điều Khiển LED PWM</h2>
        <p>Độ sáng: <span id="pwmDisplay" class="val-text">0</span> / 255</p>
        <input type="range" min="0" max="255" value="0" class="slider" id="ledSlider">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY", // Điền Web API Key
            authDomain: "pwm-757e4.firebaseapp.com",
            databaseURL: "https://pwm-757e4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pwm-757e4",
            storageBucket: "pwm-757e4.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const pwmRef = ref(database, 'pwmValue');

        const slider = document.getElementById('ledSlider');
        const display = document.getElementById('pwmDisplay');

        // Lấy giá trị hiện tại trên Firebase về giao diện web
        onValue(pwmRef, (snapshot) => {
            const val = snapshot.val() || 0;
            slider.value = val;
            display.innerText = val;
        });

        // Gửi dữ liệu mới lên Firebase khi kéo slider
        slider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            display.innerText = val;
            set(pwmRef, val);
        });
    </script>
</body>
</html>
